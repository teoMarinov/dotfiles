general {
    # We remove lock_cmd from here so it doesn't auto-lock
    # Lock before suspend; backgrounded so the blocking hyprlock doesn't delay sleep
    before_sleep_cmd = pgrep -x hyprlock || (hyprlock &)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ mode = "on" })'
}

listener {
    # How long to wait AFTER locking (e.g., 60 seconds)
    timeout = 5

    # Check if hyprlock is running. If yes, turn off screen.
    on-timeout = pgrep -x hyprlock && hyprctl dispatch 'hl.dsp.dpms({ mode = "off" })'

    # Always turn screen back on when you move the mouse/type
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ mode = "on" })'
}

listener {
   timeout = 900

   on-timeout = pgrep -x hyprlock || (hyprlock & hyprctl dispatch 'hl.dsp.dpms({ mode = "off" })')
   on-resume = hyprctl dispatch 'hl.dsp.dpms({ mode = "on" })'
}
